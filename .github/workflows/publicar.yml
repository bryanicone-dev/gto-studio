# Faz tudo na nuvem a cada push na main (ou manualmente em Actions > Publicar site > Run workflow).
# Em pull requests roda tudo e guarda o site como artefato "site", mas não publica:
#   1. roda os testes;
#   2. resolve os spots da biblioteca, um preset por máquina, em paralelo (as situações de "wide" em
#      spots.json se dividem em várias máquinas; com cache: só
#      recalcula o que ainda não existe; para refazer tudo, aumente "version" em spots.json).
#      Em pull requests só usa o cache da main: spots novos são calculados uma vez, na publicação;
#   3. gera a tabela de equity pré-flop do Push/fold (com cache), compila o site (WebAssembly) e publica no Hugging Face Space.
# Requer o secret HF_TOKEN (token "Write" do Hugging Face) em Settings > Secrets and variables > Actions.
name: Publicar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Toda noite (03:00 em Brasília) resolve os flops pedidos pela análise de mãos e publica.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  HF_SPACE: bryansennaprog/gto-studio
  # Projeto Supabase do site (chave publishable, pública): lista de flops pedidos pela análise de mãos.
  SUPABASE_URL: https://maqfbjjfurikflhodbzo.supabase.co
  SUPABASE_KEY: sb_publishable_UyLcLs_tfnGyzLAnruKPbw_hscvYYuH
  CARGO_TERM_COLOR: never

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-native-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --release

  plano:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.p.outputs.presets }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          node -e '
            const s = require("./deploy/library/spots.json");
            const slug = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
            // Uma entrada por máquina: as situações de "wide" se dividem em n partes (key = cache de cada parte).
            const parts = s.presets.flatMap((name) => {
              const n = (s.wide && s.wide.presets[name]) || 1;
              return [...Array(n)].map((_, k) => ({ name, slug: slug(name), shard: k + "/" + n, key: slug(name) + (n > 1 ? "-p" + k : "") }));
            });
            console.log("presets=" + JSON.stringify(parts));
            console.log("version=" + (s.version || 1));
          ' >> "$GITHUB_OUTPUT"

  biblioteca:
    needs: plano
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.plano.outputs.presets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-native-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: spots
          key: spots-v${{ needs.plano.outputs.version }}-${{ matrix.preset.key }}-${{ github.run_id }}
          # A primeira vez que uma situação é dividida, cada parte começa do cache da situação inteira.
          restore-keys: |
            spots-v${{ needs.plano.outputs.version }}-${{ matrix.preset.key }}-
            spots-v${{ needs.plano.outputs.version }}-${{ matrix.preset.slug }}-
      - name: Flops pedidos pelo site
        env:
          PRESET: ${{ matrix.preset.name }}
        run: node deploy/library/extra.mjs "$PRESET" > extra.json && cat extra.json
      - name: Resolver ${{ matrix.preset.name }}
        env:
          PRESET: ${{ matrix.preset.name }}
          LIBRARY_EXTRA: extra.json
          LIBRARY_SHARD: ${{ matrix.preset.shard }}
          LIBRARY_MAX_NEW: '6'
          LIBRARY_DEADLINE_MIN: '300'
          LIBRARY_ONLY_CACHED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: cargo run --release --bin library -- deploy/library/spots.json spots "$PRESET"
      - uses: actions/upload-artifact@v4
        with:
          name: spots-${{ matrix.preset.key }}
          path: spots
          retention-days: 3

  site:
    needs: [testes, biblioteca]
    # Publica mesmo se uma situação da biblioteca falhar (usa o que ficou pronto); só não publica sem testes.
    if: ${{ !cancelled() && needs.testes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: spots-*
          path: partes
      - run: node deploy/library/merge.mjs partes library
      - uses: actions/cache@v4
        with:
          path: pushfold
          key: pushfold-${{ hashFiles('deploy/pushfold/equity.mjs') }}
      - name: Tabela de equity do Push/fold
        run: test -f pushfold/equity.bin || node deploy/pushfold/equity.mjs pushfold/equity.bin 20000
      - name: Ferramentas WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          v=$(grep -A1 'name = "wasm-bindgen"' web/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$v/wasm-bindgen-$v-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          echo "$PWD/wasm-bindgen-$v-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            web/target
          key: cargo-web-${{ hashFiles('web/Cargo.lock', 'Cargo.lock') }}
      - run: bash deploy/web/build.sh
      - run: cp deploy/huggingface/README.md dist/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 3
      - if: github.event_name != 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: github.event_name != 'pull_request'
        run: pip install --quiet huggingface_hub
      - name: Publicar no Hugging Face
        if: github.event_name != 'pull_request'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/huggingface/upload.py
