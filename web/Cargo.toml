[package]
name = "gto-studio-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
publish = false

# Browser build: the engine compiled to WebAssembly, single-threaded (no rayon, no server).
[lib]
crate-type = ["cdylib"]

[dependencies]
gto-studio = { path = "..", default-features = false }
serde_json = "1.0.154"
wasm-bindgen = "0.2.129"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
